name: Scripture source archive and semantic audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/scripture-source-audit.yml"
      - "tools/scripture_source_audit.py"
      - "tools/usfm_semantic_audit.py"
      - "tools/validate_translation_rights.py"
      - "tools/validate_usfm_marker_registry.py"
      - "tools/usfm_to_structured_content.py"
      - "tools/scripture_import_preflight.py"
      - "tools/usfm_batch_conversion.py"
      - "tools/scripture_import_staging_coordinator.py"
      - "data/usfm/**"
      - "data/versification/**"
      - "data/rights/**"
      - "tests/source_audit/**"
      - "tests/rights/**"
      - "tests/usfm_registry/**"
      - "tests/usfm_preflight/**"
      - "tests/usfm_batch/**"
      - "tests/usfm_staging/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test source-audit utility
        run: python -m unittest discover -s tests/source_audit -v

      - name: Test translation rights publication gate
        run: |
          python -m unittest discover -s tests/rights -v
          python tools/validate_translation_rights.py data/rights/translation-rights-register.json

      - name: Test USFM marker registry and validate mappings
        run: |
          python -m unittest discover -s tests/usfm_registry -v
          python tools/validate_usfm_marker_registry.py data/usfm/marker-registry.json

      - name: Test Scripture import preflight engine
        run: python -m unittest discover -s tests/usfm_preflight -v

      - name: Test USFM batch conversion orchestrator
        run: python -m unittest discover -s tests/usfm_batch -v

      - name: Test Scripture import staging coordinator\n        run: python -m unittest discover -s tests/usfm_staging -v\n\n      - name: Install pinned USFM Technical Committee reference parser
        run: python -m pip install "usfmtc==0.4.10"

      - name: Smoke-test parser-backed structured conversion with synthetic USFM
        run: |
          python tools/usfm_to_structured_content.py tests/usfm_registry/fixtures/minimal.usfm \
            --edition-id SYNTHETIC \
            --source-id synthetic \
            --source-member fixtures/minimal.usfm \
            --registry data/usfm/marker-registry.json \
            --output "$RUNNER_TEMP/synthetic-structured-content.json"

      - name: Download, audit and safely extract official WEBP and KJV archives
        run: |
          python tools/scripture_source_audit.py \
            --download \
            --cache-dir "$RUNNER_TEMP/source-archive-cache" \
            --extract-usfm-dir "$RUNNER_TEMP/usfm-source" \
            --output-dir "$RUNNER_TEMP/source-audit-report"

      - name: Parse with USFM 2.5 and 3.1 profiles and round-trip every source member
        run: |
          python tools/usfm_semantic_audit.py \
            --source-dir "$RUNNER_TEMP/usfm-source" \
            --output "$RUNNER_TEMP/source-audit-report/semantic-audit.json"

      - name: Upload metadata-only audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scripture-source-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/source-audit-report/
          if-no-files-found: warn
