name: Scripture source archive and semantic audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/scripture-source-audit.yml"
      - "tools/scripture_source_audit.py"
      - "tools/usfm_semantic_audit.py"
      - "tests/source_audit/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test source-audit utility
        run: python -m unittest discover -s tests/source_audit -v

      - name: Install pinned USFM Technical Committee reference parser
        run: python -m pip install "usfmtc==0.4.10"

      - name: Download, audit and safely extract official WEBP and KJV archives
        run: |
          python tools/scripture_source_audit.py \
            --download \
            --cache-dir "$RUNNER_TEMP/source-archive-cache" \
            --extract-usfm-dir "$RUNNER_TEMP/usfm-source" \
            --output-dir "$RUNNER_TEMP/source-audit-report"

      - name: Parse with USFM 2.5 and 3.1 profiles and round-trip every source member
        run: |
          python tools/usfm_semantic_audit.py \
            --source-dir "$RUNNER_TEMP/usfm-source" \
            --output "$RUNNER_TEMP/source-audit-report/semantic-audit.json"

      - name: Upload metadata-only audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scripture-source-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/source-audit-report/
          if-no-files-found: warn
