name: SQLite and D1 local schema validation

on:
  push:
    branches: [main]
    paths:
      - "docs/sql/**"
      - "tests/sqlite/**"
      - ".github/workflows/sqlite-validation.yml"
  pull_request:
    paths:
      - "docs/sql/**"
      - "tests/sqlite/**"
      - ".github/workflows/sqlite-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run SQLite regression tests
        run: python -m unittest discover -s tests/sqlite -v

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install pinned Wrangler CLI
        run: npm install --no-save --package-lock=false wrangler@4.162.0

      - name: Create temporary local D1 configuration
        run: |
          cat > "$RUNNER_TEMP/wrangler.toml" <<'EOF'
          name = "bible-study-schema-validation"
          compatibility_date = "2026-11-18"

          [[d1_databases]]
          binding = "DB"
          database_name = "bible-study-schema-validation"
          database_id = "00000000-0000-0000-0000-000000000000"
          EOF

      - name: Apply Scripture core migration to local D1
        run: |
          npx wrangler d1 execute bible-study-schema-validation \
            --local --config "$RUNNER_TEMP/wrangler.toml" \
            --persist-to "$RUNNER_TEMP/d1-state" \
            --file docs/sql/0001_scripture_core.sql

      - name: Seed Protestant 66-book canon in local D1
        run: |
          npx wrangler d1 execute bible-study-schema-validation \
            --local --config "$RUNNER_TEMP/wrangler.toml" \
            --persist-to "$RUNNER_TEMP/d1-state" \
            --file docs/sql/0002_seed_protestant_66.sql

      - name: Apply reading progress migration to local D1
        run: |
          npx wrangler d1 execute bible-study-schema-validation \
            --local --config "$RUNNER_TEMP/wrangler.toml" \
            --persist-to "$RUNNER_TEMP/d1-state" \
            --file docs/sql/0003_reading_progress.sql

      - name: Apply grouped versification mapping migration to local D1
        run: |
          npx wrangler d1 execute bible-study-schema-validation \
            --local --config "$RUNNER_TEMP/wrangler.toml" \
            --persist-to "$RUNNER_TEMP/d1-state" \
            --file docs/sql/0004_versification_mapping_groups.sql

      - name: Apply translation-text content-state migration to local D1
        run: |
          npx wrangler d1 execute bible-study-schema-validation \
            --local --config "$RUNNER_TEMP/wrangler.toml" \
            --persist-to "$RUNNER_TEMP/d1-state" \
            --file docs/sql/0005_translation_text_content_states.sql

      - name: Apply structured translation-content migration to local D1
        run: |
          npx wrangler d1 execute bible-study-schema-validation \
            --local --config "$RUNNER_TEMP/wrangler.toml" \
            --persist-to "$RUNNER_TEMP/d1-state" \
            --file docs/sql/0006_structured_translation_content.sql

      - name: Exercise structured content nodes in local D1
        run: |
          npx wrangler d1 execute bible-study-schema-validation \
            --local --config "$RUNNER_TEMP/wrangler.toml" \
            --persist-to "$RUNNER_TEMP/d1-state" \
            --command "INSERT INTO translation_content_blocks (id, edition_id, versification_scheme_id, work_id, chapter_id, anchor_unit_id, block_order, block_type, source_marker, source_member, source_order, created_at, updated_at) VALUES ('d1-content-block', 'd1-test-edition', 'd1-test-scheme', 'work-gen', 'd1-gen-1', 'd1-a-v1', 1, 'paragraph', '\\p', '01-GEN.usfm', 1, 1800000000000, 1800000000000); INSERT INTO translation_content_nodes (id, block_id, node_order_path, node_type, source_marker, text_content, attributes_json, source_order, created_at) VALUES ('d1-content-span', 'd1-content-block', '0001', 'span', '\\add', NULL, '{\"style\":\"added\"}', 1, 1800000000000); INSERT INTO translation_content_nodes (id, block_id, parent_node_id, node_order_path, node_type, text_content, source_order, created_at) VALUES ('d1-content-text', 'd1-content-block', 'd1-content-span', '0001.0001', 'text', 'Synthetic content node', 2, 1800000000000); CREATE TABLE ci_assert_content_tree (ok INTEGER CHECK(ok = 1)); INSERT INTO ci_assert_content_tree SELECT CASE WHEN (SELECT COUNT(*) FROM translation_content_nodes WHERE block_id = 'd1-content-block') = 2 AND (SELECT parent_node_id FROM translation_content_nodes WHERE id = 'd1-content-text') = 'd1-content-span' THEN 1 ELSE 0 END; DROP TABLE ci_assert_content_tree;"

      - name: Assert D1 schema, canon seed and foreign-key integrity
        run: |
          npx wrangler d1 execute bible-study-schema-validation \
            --local --config "$RUNNER_TEMP/wrangler.toml" \
            --persist-to "$RUNNER_TEMP/d1-state" \
            --command "CREATE TABLE ci_assert_66_books (book_count INTEGER CHECK(book_count = 66)); INSERT INTO ci_assert_66_books SELECT COUNT(*) FROM canon_books WHERE canon_id = 'canon-protestant-66' AND is_included = 1; DROP TABLE ci_assert_66_books; CREATE TABLE ci_assert_foreign_keys (ok INTEGER CHECK(ok = 1)); INSERT INTO ci_assert_foreign_keys SELECT CASE WHEN COUNT(*) = 0 THEN 1 ELSE 0 END FROM pragma_foreign_key_check; DROP TABLE ci_assert_foreign_keys; SELECT COUNT(*) AS protestant_book_count FROM canon_books WHERE canon_id = 'canon-protestant-66' AND is_included = 1;"

      - name: Seed a minimal D1 versification fixture
        run: |
          npx wrangler d1 execute bible-study-schema-validation \
            --local --config "$RUNNER_TEMP/wrangler.toml" \
            --persist-to "$RUNNER_TEMP/d1-state" \
            --command "INSERT INTO versification_schemes (id, code, name, description, version, source_note, status, created_at, updated_at) VALUES ('d1-test-scheme', 'd1-test', 'D1 test scheme', 'CI only', '1', 'CI fixture', 'verified', 1800000000000, 1800000000000), ('d1-test-scheme-b', 'd1-test-b', 'D1 target test scheme', 'CI only', '1', 'CI fixture', 'verified', 1800000000000, 1800000000000); INSERT INTO scheme_chapters (id, scheme_id, work_id, chapter_label, chapter_order) VALUES ('d1-gen-1', 'd1-test-scheme', 'work-gen', '1', 1), ('d1-exo-1', 'd1-test-scheme', 'work-exo', '1', 1), ('d1-gen-1-b', 'd1-test-scheme-b', 'work-gen', '1', 1); INSERT INTO scripture_units (id, scheme_id, work_id, chapter_id, unit_label, unit_order, unit_kind) VALUES ('d1-a-v1', 'd1-test-scheme', 'work-gen', 'd1-gen-1', '1', 1, 'verse'), ('d1-a-v2', 'd1-test-scheme', 'work-gen', 'd1-gen-1', '2', 2, 'verse'), ('d1-a-v3', 'd1-test-scheme', 'work-gen', 'd1-gen-1', '3', 3, 'verse'), ('d1-a-v4', 'd1-test-scheme', 'work-gen', 'd1-gen-1', '4', 4, 'verse'), ('d1-b-v1', 'd1-test-scheme-b', 'work-gen', 'd1-gen-1-b', '1', 1, 'verse'), ('d1-b-v2', 'd1-test-scheme-b', 'work-gen', 'd1-gen-1-b', '2', 2, 'verse');"

      - name: Exercise text-bearing, annotation-only and empty-marker content states in D1
        run: |
          npx wrangler d1 execute bible-study-schema-validation \
            --local --config "$RUNNER_TEMP/wrangler.toml" \
            --persist-to "$RUNNER_TEMP/d1-state" \
            --command "INSERT INTO translation_editions (id, code, name, abbreviation, language_tag, versification_scheme_id, created_at, updated_at) VALUES ('d1-test-edition', 'd1-test-ed', 'D1 synthetic edition', 'D1T', 'en', 'd1-test-scheme', 1800000000000, 1800000000000); INSERT INTO translation_texts (id, edition_id, versification_scheme_id, scripture_unit_id, text, footnote_metadata_json, content_state, created_at, updated_at) VALUES ('d1-text', 'd1-test-edition', 'd1-test-scheme', 'd1-a-v1', 'Synthetic test wording', NULL, 'text', 1800000000000, 1800000000000), ('d1-note-only', 'd1-test-edition', 'd1-test-scheme', 'd1-a-v2', '', '{\"footnotes\":[{\"marker\":\"f\"}]}', 'annotation_only', 1800000000000, 1800000000000), ('d1-empty-marker', 'd1-test-edition', 'd1-test-scheme', 'd1-a-v3', '', NULL, 'empty_marker', 1800000000000, 1800000000000); CREATE TABLE ci_assert_text_states (ok INTEGER CHECK(ok = 1)); INSERT INTO ci_assert_text_states SELECT CASE WHEN COUNT(*) = 3 AND SUM(CASE WHEN content_state = 'annotation_only' AND text = '' AND footnote_metadata_json IS NOT NULL THEN 1 ELSE 0 END) = 1 THEN 1 ELSE 0 END FROM translation_texts WHERE edition_id = 'd1-test-edition'; DROP TABLE ci_assert_text_states;"

      - name: Assert D1 rejects blank text with the default text-bearing state
        run: |
          set +e
          output=$(npx wrangler d1 execute bible-study-schema-validation \
            --local --config "$RUNNER_TEMP/wrangler.toml" \
            --persist-to "$RUNNER_TEMP/d1-state" \
            --command "INSERT INTO translation_texts (id, edition_id, versification_scheme_id, scripture_unit_id, text, content_state, created_at, updated_at) VALUES ('d1-invalid-text-state', 'd1-test-edition', 'd1-test-scheme', 'd1-a-v4', '', 'text', 1800000000000, 1800000000000);" 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "D1 unexpectedly accepted blank text as a text-bearing verse."
            exit 1
          fi
          if ! grep -q "translation text does not match its content state" <<< "$output"; then
            echo "D1 failed for an unexpected reason."
            exit 1
          fi

      - name: Assert D1 prevents removing metadata from an annotation-only anchor
        run: |
          set +e
          output=$(npx wrangler d1 execute bible-study-schema-validation \
            --local --config "$RUNNER_TEMP/wrangler.toml" \
            --persist-to "$RUNNER_TEMP/d1-state" \
            --command "UPDATE translation_texts SET footnote_metadata_json = NULL WHERE id = 'd1-note-only';" 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "D1 unexpectedly allowed an annotation-only anchor to lose its note."
            exit 1
          fi
          if ! grep -q "translation text does not match its content state" <<< "$output"; then
            echo "D1 failed for an unexpected reason."
            exit 1
          fi

      - name: Exercise selected-book scope and valid chapter progress in D1
        run: |
          npx wrangler d1 execute bible-study-schema-validation \
            --local --config "$RUNNER_TEMP/wrangler.toml" \
            --persist-to "$RUNNER_TEMP/d1-state" \
            --command "INSERT INTO reading_trackers (id, user_id, name, canon_id, versification_scheme_id, scope_mode, created_at, updated_at) VALUES ('d1-selected', 'ci-user', 'D1 selected scope', 'canon-protestant-66', 'd1-test-scheme', 'all_books', 1800000000000, 1800000000000); INSERT INTO reading_tracker_books (id, tracker_id, canon_id, work_id, display_order) VALUES ('d1-selected-gen', 'd1-selected', 'canon-protestant-66', 'work-gen', 1); UPDATE reading_trackers SET scope_mode = 'selected_books', updated_at = 1800000000000 WHERE id = 'd1-selected'; INSERT INTO reading_tracker_chapter_progress (id, tracker_id, canon_id, versification_scheme_id, work_id, chapter_id, progress_state, started_at, completed_at, updated_at) VALUES ('d1-gen-progress', 'd1-selected', 'canon-protestant-66', 'd1-test-scheme', 'work-gen', 'd1-gen-1', 'read', 1800000000000, 1800000000000, 1800000000000);"

      - name: Exercise grouped one-to-many and many-to-one mapping storage in D1
        run: |
          npx wrangler d1 execute bible-study-schema-validation \
            --local --config "$RUNNER_TEMP/wrangler.toml" \
            --persist-to "$RUNNER_TEMP/d1-state" \
            --command "INSERT INTO scripture_mapping_groups (id, from_scheme_id, to_scheme_id, group_type, source_id, source_reference, confidence, review_status, rationale, created_at, updated_at) VALUES ('d1-mapgroup', 'd1-test-scheme', 'd1-test-scheme-b', 'complex', 'ci-fixture', 'CI 3-to-2 mapping', 'unreviewed', 'pending', 'Validate grouped multi-unit references.', 1800000000000, 1800000000000); INSERT INTO scripture_mapping_group_members (id, mapping_group_id, from_scheme_id, to_scheme_id, side, scheme_id, unit_id, member_order) VALUES ('d1-map-from-1', 'd1-mapgroup', 'd1-test-scheme', 'd1-test-scheme-b', 'from', 'd1-test-scheme', 'd1-a-v1', 1), ('d1-map-from-2', 'd1-mapgroup', 'd1-test-scheme', 'd1-test-scheme-b', 'from', 'd1-test-scheme', 'd1-a-v2', 2), ('d1-map-from-3', 'd1-mapgroup', 'd1-test-scheme', 'd1-test-scheme-b', 'from', 'd1-test-scheme', 'd1-a-v3', 3), ('d1-map-to-1', 'd1-mapgroup', 'd1-test-scheme', 'd1-test-scheme-b', 'to', 'd1-test-scheme-b', 'd1-b-v1', 1), ('d1-map-to-2', 'd1-mapgroup', 'd1-test-scheme', 'd1-test-scheme-b', 'to', 'd1-test-scheme-b', 'd1-b-v2', 2); INSERT INTO scripture_unit_mappings (id, from_unit_id, from_scheme_id, to_unit_id, to_scheme_id, mapping_group_id, mapping_type, source_id, confidence, review_status, created_at) VALUES ('d1-map-edge', 'd1-a-v1', 'd1-test-scheme', 'd1-b-v1', 'd1-test-scheme-b', 'd1-mapgroup', 'partial', 'ci-fixture', 'unreviewed', 'pending', 1800000000000); CREATE TABLE ci_assert_mapping_group (ok INTEGER CHECK(ok = 1)); INSERT INTO ci_assert_mapping_group SELECT CASE WHEN (SELECT COUNT(*) FROM scripture_mapping_group_members WHERE mapping_group_id = 'd1-mapgroup' AND side = 'from') = 3 AND (SELECT COUNT(*) FROM scripture_mapping_group_members WHERE mapping_group_id = 'd1-mapgroup' AND side = 'to') = 2 AND (SELECT COUNT(*) FROM scripture_unit_mappings WHERE mapping_group_id = 'd1-mapgroup') = 1 THEN 1 ELSE 0 END; DROP TABLE ci_assert_mapping_group;"

      - name: Assert D1 rejects progress outside selected-book scope
        run: |
          set +e
          output=$(npx wrangler d1 execute bible-study-schema-validation \
            --local --config "$RUNNER_TEMP/wrangler.toml" \
            --persist-to "$RUNNER_TEMP/d1-state" \
            --command "INSERT INTO reading_tracker_chapter_progress (id, tracker_id, canon_id, versification_scheme_id, work_id, chapter_id, progress_state, started_at, completed_at, updated_at) VALUES ('d1-invalid-exo', 'd1-selected', 'canon-protestant-66', 'd1-test-scheme', 'work-exo', 'd1-exo-1', 'read', 1800000000000, 1800000000000, 1800000000000);" 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "D1 unexpectedly accepted progress for an unselected book."
            exit 1
          fi
          if ! grep -q "chapter is outside selected tracker book scope" <<< "$output"; then
            echo "D1 failed for an unexpected reason."
            exit 1
          fi

      - name: Assert D1 prevents deleting the final selected book
        run: |
          set +e
          output=$(npx wrangler d1 execute bible-study-schema-validation \
            --local --config "$RUNNER_TEMP/wrangler.toml" \
            --persist-to "$RUNNER_TEMP/d1-state" \
            --command "DELETE FROM reading_tracker_books WHERE tracker_id = 'd1-selected' AND work_id = 'work-gen';" 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "D1 unexpectedly allowed deletion of the final selected book."
            exit 1
          fi
          if ! grep -q "selected_books scope must retain at least one selected book" <<< "$output"; then
            echo "D1 failed for an unexpected reason."
            exit 1
          fi

      - name: Assert D1 prevents direct creation of an empty selected scope
        run: |
          set +e
          output=$(npx wrangler d1 execute bible-study-schema-validation \
            --local --config "$RUNNER_TEMP/wrangler.toml" \
            --persist-to "$RUNNER_TEMP/d1-state" \
            --command "INSERT INTO reading_trackers (id, user_id, name, canon_id, versification_scheme_id, scope_mode, created_at, updated_at) VALUES ('d1-empty', 'ci-user', 'Empty selected scope', 'canon-protestant-66', 'd1-test-scheme', 'selected_books', 1800000000000, 1800000000000);" 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "D1 unexpectedly accepted an empty selected scope."
            exit 1
          fi
          if ! grep -q "create selected scope by adding books before activating selected_books" <<< "$output"; then
            echo "D1 failed for an unexpected reason."
            exit 1
          fi
